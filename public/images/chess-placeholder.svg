<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="50%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#090d16"/>
        </linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="rgba(255,255,255,0.02)"/>
            <rect x="20" y="20" width="20" height="20" fill="rgba(255,255,255,0.02)"/>
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <rect width="600" height="400" fill="url(#bg)"/>
    <rect width="600" height="400" fill="url(#grid)"/>
    <circle cx="300" cy="180" r="110" fill="rgba(217, 119, 6, 0.08)"/>
    
    <!-- Knight Symbol -->
    <g transform="translate(300, 180) scale(1.3)" filter="url(#glow)">
        <text x="0" y="35" font-size="120" text-anchor="middle" fill="#f59e0b" font-family="'Cinzel', serif">♞</text>
    </g>

    <!-- Branding Text -->
    <text x="300" y="295" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" letter-spacing="4" fill="#ffffff" text-anchor="middle">CHESS<tspan fill="#f59e0b">LIV</tspan></text>
    <text x="300" y="325" font-family="'Inter', sans-serif" font-size="12" letter-spacing="2" fill="#94a3b8" text-anchor="middle">INTERNATIONAL CHESS NEWS</text>
</svg>
